name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.27.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./... -v -race
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      - run: go vet ./...
      # Pinned: an unpinned @latest lets an upstream release turn main red with no local change.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 && staticcheck ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      - run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
